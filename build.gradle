// ProGuard for code obfuscation - must come before plugins block
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // Use ProGuard 7.8+ which supports Java 25 (class version 69)
        classpath 'com.guardsquare:proguard-gradle:7.8.0'
    }
}

plugins {
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
}

ext {
    hytaleHome = "${System.getProperty("user.home")}/AppData/Roaming/Hytale"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

// Quiet warnings about missing Javadocs.
javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

// Adds the Hytale server as a build dependency, allowing you to reference and
// compile against their code. This requires you to have Hytale installed using
// the official launcher for now.
dependencies {
    implementation(files("$hytaleHome/install/$patchline/package/game/latest/Server/HytaleServer.jar"))
    
    // SimpleClaims plugin dependency (implementation = available at compile and runtime)
    // Place the SimpleClaims JAR file in the 'libs' folder in your project root
    // Note: This won't bundle the JAR since Hytale loads plugins separately at runtime
    implementation(files("$projectDir/libs/SimpleClaims-1.0.9.jar"))
    
    // Hyfaction plugin dependency (implementation = available at compile and runtime)
    // Place the Hyfaction JAR file in the 'libs' folder in your project root
    // Note: This won't bundle the JAR since Hytale loads plugins separately at runtime
    implementation(files("$projectDir/libs/Hyfaction-1.0.140.jar"))
}

// Create the working directory to run the server if it does not already exist.
def serverRunDir = file("$projectDir/run")
if (!serverRunDir.exists()) {
    serverRunDir.mkdirs()
}

// Updates the manifest.json file with the latest properties defined in the
// build.properties file. Currently we update the version and if packs are
// included with the plugin.
tasks.register('updatePluginManifest') {
    def manifestFile = file('src/main/resources/manifest.json')
    doLast {
        if (!manifestFile.exists()) {
            throw new GradleException("Could not find manifest.json at ${manifestFile.path}!")
        }
        def manifestJson = new groovy.json.JsonSlurper().parseText(manifestFile.text)
        manifestJson.Version = version
        manifestJson.IncludesAssetPack = includes_pack.toBoolean()
        manifestFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifestJson))
    }
}

// Makes sure the plugin manifest is up to date.
tasks.named('processResources') {
    dependsOn 'updatePluginManifest'
}

// Obfuscation task using ProGuard (7.8+ supports Java 25)
tasks.register('obfuscate', proguard.gradle.ProGuardTask) {
    dependsOn jar
    
    // Input JAR (compiled with Java 25)
    injars jar.archiveFile
    
    // Output JAR (obfuscated)
    outjars("${buildDir}/libs/${project.name}-${version}-obfuscated.jar")
    
    // ProGuard configuration file
    configuration('proguard-rules.pro')
    
    // Library JARs (don't obfuscate these, just reference them)
    libraryjars(files("$hytaleHome/install/$patchline/package/game/latest/Server/HytaleServer.jar"))
    libraryjars(files("$projectDir/libs/SimpleClaims-1.0.9.jar"))
    libraryjars(files("$projectDir/libs/Hyfaction-1.0.140.jar"))
    
    // Java runtime - use Java 25 compatible path
    def javaHome = System.getProperty('java.home')
    if (file("$javaHome/jmods").exists()) {
        libraryjars(files("$javaHome/jmods/java.base.jmod"), jarfilter: '!**.jar', filter: '!module-info.class')
    } else {
        // Fallback for older Java versions
        libraryjars(files("$javaHome/lib/rt.jar"))
    }
    
    // Don't print warnings for missing classes (since we're using external JARs)
    dontwarn()
    
    // Keep manifest
    keepattributes 'Manifest'
    
    // Print mapping file for debugging (optional - you can remove this)
    printmapping("${buildDir}/proguard-mapping.txt")
}

// Creates a run configuration in IDEA that will run the Hytale server with
// your plugin and the default assets.
idea.project.settings.runConfigurations {
    'HytaleServer'(org.jetbrains.gradle.ext.Application) {
        mainClass = 'com.hypixel.hytale.Main'
        moduleName = project.idea.module.name + '.main'
        programParameters = "--allow-op --assets=$hytaleHome/install/$patchline/package/game/latest/Assets.zip"
        if (includes_pack.toBoolean()) {
            programParameters += " --mods=${sourceSets.main.java.srcDirs.first().parentFile.absolutePath}"
        }
        if (load_user_mods.toBoolean()) {
            programParameters += " --mods=$hytaleHome/UserData/Mods"
        }
        workingDirectory = serverRunDir.absolutePath
    }
}